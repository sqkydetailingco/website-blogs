<script>
(function(){
  var root = document.getElementById('sqky-hero-desktopview-webhero');
  if (!root) return;
  var btn = root.querySelector('[data-sqky-play]');
  if (!btn) return;
  var overlay = null, vid = null, lastFocus = null;

  function isFs(){ return document.fullscreenElement || document.webkitFullscreenElement; }

  function build(){
    overlay = document.createElement('div');
    overlay.className = 'sqkyVODesktop';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', btn.getAttribute('aria-label') || 'Video');
    overlay.innerHTML = '<button type="button" class="sqkyVOClose" aria-label="Close video">&times;</button><video playsinline controls controlsList="nodownload" preload="none"></video>';
    document.body.appendChild(overlay);
    vid = overlay.querySelector('video');
    vid.setAttribute('poster', btn.getAttribute('data-poster') || '');
    overlay.querySelector('.sqkyVOClose').addEventListener('click', close);
    vid.addEventListener('webkitendfullscreen', close);
    document.addEventListener('fullscreenchange', function(){ if (overlay.classList.contains('is-open') && !isFs()) close(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && overlay.classList.contains('is-open')) close(); });
  }

  function open(){
    lastFocus = document.activeElement;
    if (!overlay) build();
    if (!vid.getAttribute('src')) vid.src = btn.getAttribute('data-video');
    overlay.classList.add('is-open');
    document.documentElement.style.overflow = 'hidden';
    var p = vid.play(); if (p && p.catch) p.catch(function(){});
    try {
      var rf = overlay.requestFullscreen || overlay.webkitRequestFullscreen;
      if (rf) { var r = rf.call(overlay); if (r && r.catch) r.catch(function(){}); }
      else if (vid.webkitEnterFullscreen) { vid.webkitEnterFullscreen(); }
    } catch (e) {}
    overlay.querySelector('.sqkyVOClose').focus();
  }

  function close(){
    if (!overlay || !overlay.classList.contains('is-open')) return;
    vid.pause();
    overlay.classList.remove('is-open');
    document.documentElement.style.overflow = '';
    try {
      if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    } catch (e) {}
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  btn.addEventListener('click', open);
})();
</script>
